{% extends "base.html" %}

{% block content %}

<h1>Network Devices</h1>

<table>
    <tr>
        <th>Name</th>
        <th>IP</th>
        <th>Type</th>
        <th>Status</th>
        <th>Action</th>
    </tr>

    {% for device in devices %}
    <tr>
        <td>{{ device[1] }}</td>
        <td>{{ device[2] }}</td>
        <td>{{ device[3] }}</td>
        <td>
            {% if device[4] == 'online' %}
                <span class="status online">ONLINE</span>
            {% else %}
                <span class="status offline">OFFLINE</span>
            {% endif %}
        </td>
        <td>
            <a href="/device/{{ device[0] }}">Open</a>
        </td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
