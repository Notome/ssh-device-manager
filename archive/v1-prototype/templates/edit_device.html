{% extends "base.html" %}

{% block content %}

<a href="/" class="btn" style="margin-bottom: 20px;">
    <i class="fas fa-arrow-left"></i> Назад
</a>

<h1 style="margin-bottom: 32px;">Редактировать: {{ device.name }}</h1>

<div class="form-container">
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Название</label>
            <input type="text" name="name" class="form-input" value="{{ device.name }}" required>
        </div>
        <div class="form-group">
            <label class="form-label">IP-адрес</label>
            <input type="text" name="ip" class="form-input" value="{{ device.ip }}" required>
        </div>
        <div class="form-group">
            <label class="form-label">Тип устройства</label>
            <input type="text" name="type" class="form-input" value="{{ device.type or '' }}">
        </div>
        <div class="form-group">
            <label class="form-label">ОС устройства</label>
            <select name="os_type" class="form-select">
                {% for key, label in os_labels.items() %}
                <option value="{{ key }}" {% if device.os_type == key %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Логин SSH</label>
            <input type="text" name="username" class="form-input" value="{{ device.username or '' }}">
        </div>
        <div class="form-group">
            <label class="form-label">Пароль SSH</label>
            <input type="password" name="password" class="form-input" placeholder="Оставьте пустым — не изменится" value="{{ device.password or '' }}">
        </div>
        <div class="form-group">
            <label class="form-label">Статус</label>
            <select name="status" class="form-select">
                <option value="offline" {% if device.status == 'offline' %}selected{% endif %}>Offline</option>
                <option value="online" {% if device.status == 'online' %}selected{% endif %}>Online</option>
            </select>
        </div>
        <button type="submit" class="btn btn-full" style="margin-top: 8px;">
            <i class="fas fa-save"></i> Сохранить изменения
        </button>
    </form>
</div>

{% endblock %}
