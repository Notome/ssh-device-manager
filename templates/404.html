{% extends "base.html" %}
{% block content %}

<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:100px 20px; text-align:center;">
    <div style="font-size:6rem; font-weight:800; letter-spacing:-0.04em; color:var(--border); line-height:1; margin-bottom:16px; font-variant-numeric:tabular-nums;">404</div>
    <h2 style="font-size:1.3rem; margin:0 0 10px; color:var(--text);">Страница не найдена</h2>
    <p style="color:var(--text-2); font-size:0.9rem; margin:0 0 32px; max-width:360px;">
        Запрашиваемая страница не существует или была удалена.
    </p>
    <a href="/" class="btn" style="padding:10px 26px;">
        <i class="fas fa-arrow-left"></i> Вернуться на главную
    </a>
</div>

{% endblock %}
